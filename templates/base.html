<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}멍냥로드 — 반려동물 동반여행 가이드{% endblock %}</title>
  <style>
    :root {
      --bg: #F7F5F0; --surface: #FFFFFF; --border: #E4DFD3; --ink: #2A2620; --ink-muted: #7A756A;
      --accent: #2E6B5E; --accent-soft: #E3EFEA;
      --ok: #2E7A50; --ok-soft: #E2EFE5; --warn: #B36A1E; --warn-soft: #F8ECDD;
      --bad: #B32A26; --bad-soft: #F8E3E0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background-color: var(--bg); color: var(--ink);
      background-image: repeating-linear-gradient(135deg, rgba(47,93,80,.03) 0, rgba(47,93,80,.03) 1px, transparent 1px, transparent 34px);
      font-family: "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, system-ui, sans-serif;
      line-height: 1.6; word-break: keep-all;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
    .wrap--wide { max-width: 960px; }
    .home-layout { display: flex; gap: 24px; align-items: flex-start; }
    .map-panel { flex: 0 0 45%; position: relative; }
    .form-panel { flex: 1 1 55%; min-width: 0; }
    .map-hint { font-size: 12.5px; color: var(--ink-muted); margin: 0 0 10px; text-align: center; }
    .kr-map { width: 100%; height: auto; display: block; }
    .kr-map path {
      fill: #E4E1D6; stroke: var(--bg); stroke-width: 1.4; cursor: pointer;
      transition: fill .15s;
    }
    .kr-map g:not(.selected):hover path { fill: var(--accent-soft); }
    .kr-map g.selected path { fill: var(--accent); }
    .kr-map text {
      font-size: 11px; fill: var(--ink-muted); text-anchor: middle; dominant-baseline: middle;
      pointer-events: none;
    }
    .kr-map g.selected text { fill: #fff; font-weight: 700; }
    .map-tooltip {
      position: absolute; z-index: 5; pointer-events: none;
      background: var(--ink); color: #fff; font-size: 12px; font-weight: 600;
      padding: 4px 9px; border-radius: 5px; transform: translate(-50%, -130%);
      white-space: nowrap; opacity: 0; transition: opacity .1s;
    }
    .map-tooltip.visible { opacity: 1; }
    @media (max-width: 760px) {
      .map-panel { display: none; }
      .home-layout { display: block; }
    }
    header.top {
      position: relative; overflow: hidden;
      margin-bottom: 28px; padding: 36px 24px; text-align: center; border-radius: 14px;
      background:
        radial-gradient(120% 120% at 15% 0%, rgba(255,255,255,.10), transparent 55%),
        linear-gradient(135deg, var(--accent), #24564A);
    }
    .hero-decor { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .hero-paw { position: absolute; color: #fff; }
    .hero-paw--1 { width: 120px; top: -26px; left: -24px; opacity: .09; transform: rotate(-18deg); }
    .hero-paw--2 { width: 90px; bottom: -28px; right: 8%; opacity: .07; transform: rotate(16deg); }
    .hero-paw--3 { width: 56px; top: 55%; right: -8px; opacity: .06; transform: translateY(-50%) rotate(-10deg); }
    header.top a, header.top p { position: relative; z-index: 1; text-decoration: none; color: #fff; }
    header.top h1 { font-size: 28px; margin: 0 0 8px; color: #fff; }
    header.top p { margin: 0; color: rgba(255,255,255,.88); font-size: 14.5px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px;
      box-shadow: 0 10px 26px -14px rgba(36,66,58,.32);
    }
    .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 28px 0; }
    .feature-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 18px 16px; text-align: center;
    }
    .feature-card svg { width: 26px; height: 26px; color: var(--accent); margin-bottom: 10px; }
    .feature-card h3 { font-size: 14px; margin: 0 0 6px; }
    .feature-card p { font-size: 12.5px; color: var(--ink-muted); margin: 0; line-height: 1.5; }
    .data-scope { text-align: center; font-size: 12.5px; color: var(--ink-muted); margin: 8px 0 0; }
    @media (max-width: 620px) {
      .feature-grid { grid-template-columns: 1fr; }
    }
    label { display: block; font-weight: 600; font-size: 13.5px; margin: 18px 0 6px; }
    label:first-of-type { margin-top: 0; }
    select, input[type="number"], input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 14.5px; background: var(--bg); color: var(--ink);
    }
    .radio-row { display: flex; gap: 8px; }
    .radio-row label {
      flex: 1; margin: 0; text-align: center; padding: 10px 8px; border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; font-weight: 500; background: var(--bg);
    }
    .radio-row input { display: none; }
    .radio-row input:checked + span { color: var(--accent); font-weight: 700; }
    .radio-row label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .hint { color: var(--ink-muted); font-size: 12.5px; margin-top: 4px; }
    button.submit {
      width: 100%; margin-top: 26px; padding: 13px; border: none; border-radius: 6px;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button.submit:hover { opacity: .92; }
    button.submit:disabled { opacity: .6; cursor: not-allowed; }
    .error-box {
      background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad);
      border-radius: 6px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 18px;
    }
    footer { text-align: center; color: var(--ink-muted); font-size: 12px; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="wrap {% block wrap_class %}{% endblock %}">
    <header class="top">
      <div class="hero-decor" aria-hidden="true">
        <svg class="hero-paw hero-paw--1" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16.5" rx="5" ry="4"/><ellipse cx="5.3" cy="9.2" rx="1.8" ry="2.4"/><ellipse cx="9.6" cy="5.6" rx="1.8" ry="2.4"/><ellipse cx="14.4" cy="5.6" rx="1.8" ry="2.4"/><ellipse cx="18.7" cy="9.2" rx="1.8" ry="2.4"/></svg>
        <svg class="hero-paw hero-paw--2" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16.5" rx="5" ry="4"/><ellipse cx="5.3" cy="9.2" rx="1.8" ry="2.4"/><ellipse cx="9.6" cy="5.6" rx="1.8" ry="2.4"/><ellipse cx="14.4" cy="5.6" rx="1.8" ry="2.4"/><ellipse cx="18.7" cy="9.2" rx="1.8" ry="2.4"/></svg>
        <svg class="hero-paw hero-paw--3" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16.5" rx="5" ry="4"/><ellipse cx="5.3" cy="9.2" rx="1.8" ry="2.4"/><ellipse cx="9.6" cy="5.6" rx="1.8" ry="2.4"/><ellipse cx="14.4" cy="5.6" rx="1.8" ry="2.4"/><ellipse cx="18.7" cy="9.2" rx="1.8" ry="2.4"/></svg>
      </div>
      <a href="/"><h1>🐾 멍냥로드</h1></a>
      <p>모호한 반려동물 동반 조건을 대신 해석해드립니다</p>
    </header>
    {% block content %}{% endblock %}
    <footer>출처: ⓒ한국관광공사</footer>
  </div>
</body>
</html>
