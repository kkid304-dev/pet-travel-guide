{% for p in places %}
  {% if p.verdict.startswith('✅') %}
    {% set tone = 'ok' %}
  {% elif p.verdict.startswith('❌') %}
    {% set tone = 'bad' %}
  {% else %}
    {% set tone = 'warn' %}
  {% endif %}
  <div class="card" style="margin-bottom:12px; border-left:4px solid var(--{{ tone }});">
    <div style="display:flex; justify-content:space-between; gap:12px; align-items:baseline;">
      <div>
        <span style="font-size:11.5px; color:var(--ink-muted); font-weight:600;">[{{ p.category }}]</span>
        <strong style="font-size:15.5px;">{{ p.title }}</strong>
      </div>
    </div>
    <div style="font-size:12.5px; color:var(--ink-muted); margin-top:2px;">{{ p.addr }}</div>
    <div style="margin-top:10px; padding:9px 12px; background:var(--{{ tone }}-soft); color:var(--{{ tone }}); border-radius:6px; font-size:13.5px; font-weight:600;">
      {{ p.verdict }}
    </div>
  </div>
{% endfor %}
